services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kondo_anatato
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kondo_anatato"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:

